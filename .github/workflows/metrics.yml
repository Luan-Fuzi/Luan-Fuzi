name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: Asia/Shanghai
          committer_branch: metrics
          output_condition: data-changed
          filename: metrics.languages.svg
          base: header, metadata
          commits_authoring: Luan-Fuzi, Luan_Fuzi, w241liang@163.com
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: Asia/Shanghai
          committer_branch: metrics
          output_condition: data-changed
          filename: metrics.isocalendar.svg
          base: metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          extras_css: |
            svg[version="1.1"] { margin-top: -80px !important; }

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: Asia/Shanghai
          committer_branch: metrics
          output_condition: data-changed
          filename: metrics.badges.svg
          base: metadata
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_stars: yes
          plugin_stars_limit: 4

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: Asia/Shanghai
          committer_branch: metrics
          output_condition: data-changed
          filename: metrics.profile.svg
          base: metadata
          commits_authoring: Luan-Fuzi, Luan_Fuzi, w241liang@163.com
          plugin_lines: yes
          plugin_lines_sections: repositories
          plugin_lines_repositories_limit: 4
          plugin_fortune: yes
