name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: Asia/Shanghai
          committer_branch: metrics
          output_condition: data-changed
          filename: metrics.languages.svg
          base: header, metadata
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: Asia/Shanghai
          committer_branch: metrics
          output_condition: data-changed
          filename: metrics.isocalendar.svg
          base: metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: Asia/Shanghai
          committer_branch: metrics
          output_condition: data-changed
          filename: metrics.badges.svg
          base: metadata
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_topics: yes
          plugin_topics_mode: icons

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: Asia/Shanghai
          committer_branch: metrics
          output_condition: data-changed
          filename: metrics.profile.svg
          base: metadata
          plugin_lines: yes
          plugin_lines_sections: repositories
          plugin_lines_repositories_limit: 4
          plugin_16personalities: yes
          plugin_16personalities_url: "https://www.16personalities.com/profiles/00b128afc1a27"
          plugin_16personalities_scores: yes
